name: CI

on:
  push:
    # Tags run through release.yml, which calls this workflow.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: CPU (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: planning
            first: test-cpu-plan
            second: test-symmetric
          - group: API
            first: test
            second: test-cpu-only
          - group: concurrency
            first: test-parallel
            second: test-specialization
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.80.0
          locked: true
      - name: CPU target
        run: |
          lscpu
          pixi run --locked mojo --version
      - name: ${{ matrix.first }}
        run: pixi run --locked "${{ matrix.first }}"
      - name: ${{ matrix.second }}
        run: pixi run --locked "${{ matrix.second }}"

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.80.0
          environments: default packaging
          locked: true
      - name: Build example
        run: pixi run --locked build
      - name: Python tooling tests
        run: pixi run --locked test-python
      - name: Packaged consumer outside the source tree
        run: pixi run --locked test-consumer
      # Until Balsa is published to modular-community, build the pinned
      # revision's own recipe into a local channel.
      - name: Build pinned Balsa package
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import ast,pathlib; t=ast.parse(pathlib.Path("tools/prepare_balsa.py").read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == "COMMIT"))')"
          git init -q "$RUNNER_TEMP/balsa"
          git -C "$RUNNER_TEMP/balsa" fetch -q --depth=1 https://github.com/idlab-discover/balsa.git "$commit"
          git -C "$RUNNER_TEMP/balsa" checkout -q FETCH_HEAD
          pixi run --manifest-path "$RUNNER_TEMP/balsa/pixi.toml" --locked -e packaging conda-build
          echo "PYRE_EXTRA_CHANNEL=-c file://$RUNNER_TEMP/balsa/build/conda" >> "$GITHUB_ENV"
      - name: Build Conda package and test an isolated installation
        run: pixi run --locked -e packaging conda-build
      - name: Record package checksums and source revision
        shell: bash
        run: |
          cd build/conda/linux-64
          sha256sum ./mojo-pyre-*.conda > SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mojo-pyre-conda-linux-64
          path: |
            build/conda/linux-64/mojo-pyre-*.conda
            build/conda/linux-64/SHA256SUMS
            build/conda/linux-64/SOURCE_COMMIT
          if-no-files-found: error
