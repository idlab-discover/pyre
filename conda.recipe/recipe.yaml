context:
  version: "0.2.0"

# The conda name `pyre` belongs to an unrelated conda-forge package; the Mojo
# package installed here is still imported as `pyre`.
package:
  name: mojo-pyre
  version: ${{ version }}

# Build this checkout; the community recipe pins the release commit instead.
source:
  path: ..
  filter:
    - src/**
    - examples/consumer.mojo
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - README.md

build:
  number: 0
  skip: not linux or not x86_64
  files:
    - lib/mojo/pyre.mojoc
  script:
    - mkdir -p "$PREFIX/lib/mojo"
    - mojo precompile -I "$PREFIX/lib/mojo" src/pyre -o "$PREFIX/lib/mojo/pyre.mojoc"

requirements:
  build:
    - mojo-compiler ==1.2.0
  host:
    - mojo-compiler ==1.2.0
    - max-core ==26.7.0
    - balsa ==0.2.1
    - numojo ==0.12.0
  run:
    - mojo-compiler ==1.2.0
    - max-core ==26.7.0
    - balsa ==0.2.1
    - numojo ==0.12.0

tests:
  - script:
      # No checkout source include: pyre, balsa and numojo resolve to installed packages.
      - mojo run --target-accelerator=none examples/consumer.mojo
    requirements:
      run:
        - gcc_linux-64
    files:
      source:
        - examples/consumer.mojo

about:
  repository: https://github.com/idlab-discover/pyre
  homepage: https://github.com/idlab-discover/pyre
  summary: Native Mojo CPU and GPU inference for Treelite tree ensembles via Balsa
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md

extra:
  project_name: mojo-pyre
  maintainers:
    - Str-Gen
