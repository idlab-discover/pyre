[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge", "https://repo.prefix.dev/modular-community"]
name = "pyre"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
prepare = "mkdir -p build"
run = "mojo run -I src -I ../balsa/src examples/predict.mojo"
build = { cmd = "mojo build -I src -I ../balsa/src examples/predict.mojo -o build/predict", depends-on = ["prepare"] }
package = { cmd = "mojo precompile -I ../balsa/src src/pyre -o build/pyre.mojoc", depends-on = ["prepare"] }
test = "mojo run -I src -I ../balsa/src -I tests tests/test_forest.mojo"
test-gpu = "mojo run -I src -I ../balsa/src tests/test_accelerator.mojo"
check = { depends-on = ["build", "package", "test"] }
fmt = "mojo format src examples tests"
assembly = { cmd = "mojo build -I src -I ../balsa/src --emit asm examples/predict.mojo -o build/predict.s", depends-on = ["prepare"] }
oracle-generate = "pixi run --manifest-path ../balsa/pixi.toml -e oracle python ../pyre/tools/generate_references.py"

[dependencies]
mojo = "==1.0.0"
max-core = "==26.5.0"
numojo = "==0.10.0"
