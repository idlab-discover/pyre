[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge", "https://repo.prefix.dev/modular-community"]
name = "pyre"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
prepare = "python tools/prepare_balsa.py"
run = { cmd = "mojo run -I src -I build/balsa-reference/src examples/predict.mojo", depends-on = ["prepare"] }
build = { cmd = "mojo build -I src -I build/balsa-reference/src examples/predict.mojo -o build/predict", depends-on = ["prepare"] }
package = { cmd = "mojo precompile -I build/balsa-reference/src src/pyre -o build/pyre.mojoc", depends-on = ["prepare"] }
test = { cmd = "mojo run -I src -I build/balsa-reference/src -I tests tests/test_forest.mojo", depends-on = ["prepare"] }
test-gpu-transfers = { cmd = "mojo run -I src -I build/balsa-reference/src tests/test_accelerator.mojo", depends-on = ["prepare"] }
build-gpu-tests = { cmd = "mojo build -I src -I build/balsa-reference/src -I tests tests/test_gpu.mojo -o build/test-gpu", depends-on = ["prepare"] }
test-gpu-inference = { cmd = "build/test-gpu", depends-on = ["build-gpu-tests"] }
run-gpu = { cmd = "mojo run -I src -I build/balsa-reference/src examples/predict_gpu.mojo", depends-on = ["prepare"] }
test-gpu = { depends-on = ["test-gpu-transfers", "test-gpu-inference", "run-gpu"] }
benchmark-gpu-build = { cmd = "mojo build -I src -I build/balsa-reference/src tools/benchmark_gpu_worker.mojo -o build/benchmark-gpu-worker", depends-on = ["prepare"] }
benchmark-gpu = { cmd = "python tools/benchmark_gpu.py", depends-on = ["benchmark-gpu-build"] }
gpu-corpus-build = { cmd = "mojo build -I build/balsa-reference/src tools/generate_gpu_model.mojo -o build/generate-gpu-model", depends-on = ["prepare"] }
test-parallel = { cmd = "mojo run -I src -I build/balsa-reference/src -I tests tests/test_parallel.mojo", depends-on = ["prepare"] }
test-specialization = { cmd = "mojo run -I src -I build/balsa-reference/src tests/test_specialization.mojo", depends-on = ["prepare"] }
test-symmetric = { cmd = "mojo run -I src -I build/balsa-reference/src tests/test_symmetric.mojo", depends-on = ["prepare"] }
benchmark-symmetric-build = { cmd = "mojo build -I src -I build/balsa-reference/src tools/benchmark_symmetric_worker.mojo -o build/benchmark-symmetric-worker", depends-on = ["prepare"] }
check = { depends-on = ["test-symmetric", "build", "package", "test", "test-parallel", "test-specialization"] }
fmt = "mojo format src examples tests"
assembly = { cmd = "mojo build -I src -I build/balsa-reference/src --emit asm examples/predict.mojo -o build/predict.s", depends-on = ["prepare"] }
oracle-generate = { cmd = "pixi run --manifest-path build/balsa-reference/pixi.toml -e oracle python tools/generate_references.py", depends-on = ["prepare"] }
benchmark-build = { cmd = "mojo build -I src -I build/balsa-reference/src tools/benchmark_worker.mojo -o build/benchmark-worker", depends-on = ["prepare"] }
benchmark = { cmd = "python tools/benchmark.py", depends-on = ["benchmark-build"] }

[dependencies]
mojo = "==1.0.0"
# Supplies max.algorithm CPU executor and the existing accelerator runtime.
max-core = "==26.5.0"
numojo = "==0.10.0"
python = ">=3.12,<3.14"
pyperf = ">=2.9,<3"
